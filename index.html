<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1317">
  <meta name="robots" content="noindex,nofollow">
  <title>北斗司命 · 试玩与宣传片</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;font-family:"Songti SC","Noto Serif CJK SC",SimSun,serif;color:#f4e9d4;background:#0b1317}
    body{margin:0;min-height:100svh;display:grid;align-content:center;background:radial-gradient(ellipse at 60% 5%,#24323a,transparent 66%),#0b1317}
    main{width:min(100% - 32px,960px);margin:24px auto 32px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 14px;border-bottom:1px solid #615442}
    h1{font-size:clamp(22px,3vw,34px);font-weight:500;letter-spacing:.15em;margin:0}
    header span{color:#c9b995;font-size:15px}
    .stage{margin:14px 0 0;aspect-ratio:16/9;position:relative;background:#080d10;box-shadow:0 8px 34px #0006}
    img,video{display:block;width:100%;height:100%;object-fit:contain}
    [hidden]{display:none!important}
    .actions{display:flex;gap:12px;align-items:center;justify-content:center;margin:23px 0 12px}
    button,a{font:inherit}
    .actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;min-height:49px;padding:8px 32px;border:1px solid #97805b;cursor:pointer;font-size:19px;letter-spacing:.12em;color:#f4e3bf;text-decoration:none;background:#162025}
    .actions .play{background:#883426;border-color:#c19b61;color:#fff0cc}
    .actions :is(button,a):hover{filter:brightness(1.18)}
    :focus-visible{outline:2px solid #f0c777;outline-offset:4px}
    p{text-align:center;color:#d4c5aa;font-size:16px;line-height:1.6;margin:15px 0}
    p a{color:#efcb91}
    @media(max-width:520px){main{width:calc(100% - 24px)}.actions>*{flex:1}.actions a,.actions button{padding:8px 12px;font-size:18px}header span{font-size:14px}}
  </style>
</head>
<body>
  <main>
    <header><h1>北斗司命</h1><span>紫微斗数互动影游</span></header>
    <div class="stage">
      <img id="cover" src="./hall.jpg" alt="瑶光、天枢、玉衡同坐案前">
      <video id="film" controls playsinline preload="none" poster="./poster.jpg" aria-label="《今夜，谁来断你的命》宣传片" hidden></video>
    </div>
    <div class="actions">
      <a class="play" href="./game/index.html?portrait=quiet-callout&amp;light=night&amp;fix=hall-idle">进入游戏</a>
      <button id="watch" type="button" aria-controls="film" aria-expanded="false">观看宣传片</button>
    </div>
    <p id="line">门内低语，似道君事。推门入席，问一桩自己的心事。</p>
    <p id="film-title" hidden>《今夜，谁来断你的命》 · 70 秒</p>
    <p id="alternate" hidden>也可在 <a href="https://www.bilibili.com/video/BV1p2yWzNEBF/" target="_blank" rel="noopener noreferrer">哔哩哔哩观看宣传片</a>。</p>
  </main>
  <script src="./pv/hls.light.min.js" defer></script>
  <script src="./watch.js" defer></script>
</body>
</html>
